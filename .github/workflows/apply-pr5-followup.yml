name: Apply PR 5 follow-up integration

on:
  push:
    branches:
      - feature/playground-3d-models
    paths:
      - .github/workflows/apply-pr5-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playground-3d-models

      - name: Apply integration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 .github/tmp/apply-pr5-followup.py
          node --check lib/playground3d.js

      - name: Commit PR update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/models/poi/vending-machine assets/models/poi/README.md \
            assets/models/playground/poly-pizza/seesaw assets/models/playground/README.md \
            lib/playground3d.js data/glot-custom.jsonc
          git rm .github/workflows/apply-pr5-followup.yml .github/tmp/apply-pr5-followup.py
          git commit -m 'feat: add Japanese vending machine, seesaw and basket swing'
          git push origin HEAD:feature/playground-3d-models
