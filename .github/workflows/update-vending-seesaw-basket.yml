name: Import vending and seesaw assets

on:
  push:
    branches:
      - feature/playground-3d-models
    paths:
      - .github/workflows/update-vending-seesaw-basket.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playground-3d-models

      - name: Download assets
        run: |
          set -euxo pipefail
          rm -rf assets/models/poi/vending-machine
          mkdir -p assets/models/poi/vending-machine/textures
          base=https://raw.githubusercontent.com/Makar210807/horror_game/149b43c47258e28cddef3a690fff92ceb4d9322a/demo/for_market/jpn_vending_machine
          curl -L --fail "$base/scene.gltf" -o assets/models/poi/vending-machine/scene.gltf
          curl -L --fail "$base/scene.bin" -o assets/models/poi/vending-machine/scene.bin
          curl -L --fail "$base/textures/JIHANKI_ATLAS_GLASS_baseColor.png" -o assets/models/poi/vending-machine/textures/JIHANKI_ATLAS_GLASS_baseColor.png
          curl -L --fail "$base/textures/JIHANKI_EMISSION_emissive.png" -o assets/models/poi/vending-machine/textures/JIHANKI_EMISSION_emissive.png
          mkdir -p assets/models/playground/poly-pizza/seesaw
          curl -L --fail https://raw.githubusercontent.com/zhangyingwei/puppy-garden-3d/5a8b637b98fb6bbf5b0663d88e6f06938fe1f533/public/assets/models/props/seesaw.glb -o assets/models/playground/poly-pizza/seesaw/seesaw.glb
          test "$(stat -c%s assets/models/poi/vending-machine/scene.bin)" -eq 1675928
          test "$(stat -c%s assets/models/playground/poly-pizza/seesaw/seesaw.glb)" -eq 115308

      - name: Commit assets
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A assets/models/poi/vending-machine assets/models/playground/poly-pizza/seesaw
          git rm .github/workflows/update-vending-seesaw-basket.yml
          git commit -m "feat: import Japanese vending machine and seesaw assets"
          git push origin HEAD:feature/playground-3d-models
