name: Integrate playground 3D feature

on:
  push:
    branches:
      - feature/playground-3d-models
    paths:
      - .github/workflows/import-playground-models.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playground-3d-models

      - name: Integrate and validate
        run: python3 .github/tmp/integrate_playground3d.py

      - name: Syntax and manifest checks
        run: |
          node --check lib/playground3d.js
          node --check cmapmaker.js
          python3 -m json.tool manifest.json >/dev/null

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json cmapmaker.js data/config-user.jsonc data/glot-custom.jsonc lib/playground3d.js assets/models/playground
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: integrate 3D playground equipment'
          git push origin HEAD:feature/playground-3d-models
