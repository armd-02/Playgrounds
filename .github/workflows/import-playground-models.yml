name: Repair supplied sandpit model

on:
  push:
    branches:
      - feature/playground-3d-models
    paths:
      - .github/workflows/import-playground-models.yml

permissions:
  contents: write

jobs:
  repair-sandpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playground-3d-models

      - name: Decode and verify supplied GLB
        shell: bash
        run: |
          set -euo pipefail
          dest="assets/models/playground/poly-pizza/sandpit"
          mkdir -p "$dest"
          cat .github/tmp/sandpit-upload.b64.part* | base64 --decode > "$dest/sandpit.glb"
          test "$(stat -c %s "$dest/sandpit.glb")" = "28304"
          echo '9d67bfcb7680e439ad344707a4f9ae10b419a50cdca7115774017d5e3e70e375  assets/models/playground/poly-pizza/sandpit/sandpit.glb' | sha256sum --check --strict
          test "$(head -c 4 "$dest/sandpit.glb")" = "glTF"

      - name: Commit repaired asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/playground/poly-pizza/sandpit/sandpit.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore supplied sandpit GLB'
          git push origin HEAD:feature/playground-3d-models
