name: Import Poly swing model

on:
  push:
    branches:
      - feature/playground-3d-models
    paths:
      - .github/workflows/update-swing-bars-springy.yml

permissions:
  contents: write

jobs:
  import-swing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playground-3d-models
      - name: Download and commit swing model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models/playground/poly-pizza/swing-set
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/zhangyingwei/puppy-garden-3d/5a8b637b98fb6bbf5b0663d88e6f06938fe1f533/public/assets/models/props/swing.glb' -o assets/models/playground/poly-pizza/swing-set/swing.glb
          test "$(stat -c%s assets/models/playground/poly-pizza/swing-set/swing.glb)" -eq 12436
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/playground/poly-pizza/swing-set/swing.glb
          git rm .github/workflows/update-swing-bars-springy.yml
          git commit -m 'feat: import Swing set by Poly by Google'
          git push origin HEAD:feature/playground-3d-models
