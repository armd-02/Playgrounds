name: Import park facility 3D models

on:
  push:
    branches:
      - feature/playground-3d-models
    paths:
      - .github/workflows/import-park-facility-models.yml

permissions:
  contents: write

jobs:
  import-facilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playground-3d-models

      - name: Download openly licensed models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models/poi/bench assets/models/poi/drinking-water assets/models/poi/vending-machine
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Aymanbalaa/grand-theft-poutine/main/game/assets/models/props/bench.glb' \
            -o assets/models/poi/bench/bench.glb
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/farpini/cambui05/main/Assets/Models/Hall/scene.gltf' \
            -o assets/models/poi/drinking-water/scene.gltf
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/farpini/cambui05/main/Assets/Models/Hall/scene.bin' \
            -o assets/models/poi/drinking-water/scene.bin
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/RetroDECK/RetroQUEST/main/assets/kenney_mini-arcade/Models/GLB%20format/vending-machine.glb' \
            -o assets/models/poi/vending-machine/vending-machine.glb

      - name: Integrate and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/import_park_facility.py
          node --check lib/playground3d.js
          grep -q 'amenity === "bench"' lib/playground3d.js
          grep -q 'amenity === "drinking_water"' lib/playground3d.js
          grep -q 'amenity === "vending_machine"' lib/playground3d.js

      - name: Commit facility models and integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/playground3d.js data/glot-custom.jsonc assets/models/poi
          git rm .github/workflows/import-park-facility-models.yml .github/tmp/import_park_facility.py
          git commit -m 'feat: add 3D models for park facilities'
          git push origin HEAD:feature/playground-3d-models
