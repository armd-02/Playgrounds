name: Replace bench model with plaggy

on:
  push:
    branches:
      - feature/playground-3d-models
    paths:
      - .github/workflows/replace-bench-plaggy.yml

permissions:
  contents: write

jobs:
  replace-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playground-3d-models

      - name: Download Bench by plaggy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/models/poi/bench
          mkdir -p assets/models/poi/bench/textures
          BASE='https://raw.githubusercontent.com/DanielHansen-IMD/xrgallery/793077798fe6d5bb51618d0ee98cbc870674588c/models/cc0_-_bench'
          curl --fail --location --retry 3 "$BASE/scene.gltf" -o assets/models/poi/bench/scene.gltf
          curl --fail --location --retry 3 "$BASE/scene.bin" -o assets/models/poi/bench/scene.bin
          curl --fail --location --retry 3 "$BASE/textures/Bench_baseColor.png" -o assets/models/poi/bench/textures/Bench_baseColor.png
          curl --fail --location --retry 3 "$BASE/textures/Bench_metallicRoughness.png" -o assets/models/poi/bench/textures/Bench_metallicRoughness.png
          curl --fail --location --retry 3 "$BASE/textures/Bench_normal.png" -o assets/models/poi/bench/textures/Bench_normal.png

      - name: Optimize textures for web map use
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            IMG='magick'
          elif command -v convert >/dev/null 2>&1; then
            IMG='convert'
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IMG='convert'
          fi
          for f in assets/models/poi/bench/textures/*.png; do
            tmp="${f%.png}.tmp.png"
            $IMG "$f" -resize '512x512>' -strip -define png:compression-level=9 "$tmp"
            mv "$tmp" "$f"
          done
          ls -lh assets/models/poi/bench/textures

      - name: Update integration, source and credits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/playground3d.js')
          s = p.read_text(encoding='utf-8')
          old = 'url: "./assets/models/poi/bench/bench.glb"'
          new = 'url: "./assets/models/poi/bench/scene.gltf"'
          assert old in s, 'old bench model URL not found'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          source = (
              '# Bench by plaggy\n\n'
              '- Canonical source: https://sketchfab.com/3d-models/cc0-bench-096d4f915819409f9739326118bd5aa7\n'
              '- Author: plaggy\n'
              '- Geometry: 260 triangles / 168 vertices on Sketchfab\n'
              '- Included format: glTF 2.0 (`scene.gltf` + `scene.bin` + optimized textures)\n'
              '- Download mirror used for this import: https://github.com/DanielHansen-IMD/xrgallery\n'
              '- License used for redistribution in this repository: Creative Commons Attribution 4.0 International (CC BY 4.0)\n'
              '- Required attribution: `CC0 - Bench by plaggy [CC BY 4.0] via Sketchfab`\n\n'
              'The current Sketchfab description also labels the work CC0/Public Domain, but the distributed glTF and its bundled license metadata identify it as CC-BY-4.0. This repository therefore keeps the more conservative CC-BY-4.0 attribution.\n\n'
              'The source 4096px PBR textures are resized to a maximum of 512px for web-map performance; geometry is unchanged.\n'
              'The model is used as a generic 3D symbol for OpenStreetMap `amenity=bench` features.\n'
          )
          Path('assets/models/poi/bench/SOURCE.md').write_text(source, encoding='utf-8')

          p = Path('assets/models/poi/README.md')
          s = p.read_text(encoding='utf-8')
          old = '| `amenity=bench` | `bench/bench.glb` | Bench by Kenney — CC0 |'
          new = '| `amenity=bench` | `bench/scene.gltf` | CC0 - Bench by plaggy — CC BY 4.0 (conservative attribution; see SOURCE.md) |'
          assert old in s, 'old bench README row not found'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('data/glot-custom.jsonc')
          s = p.read_bytes().decode('utf-8')
          assert s.count('https://kenney.nl/assets/nature-kit') == 2
          assert s.count('Bench by Kenney (CC0)') == 2
          s = s.replace('https://kenney.nl/assets/nature-kit', 'https://sketchfab.com/3d-models/cc0-bench-096d4f915819409f9739326118bd5aa7')
          s = s.replace('Bench by Kenney (CC0)', 'CC0 - Bench by plaggy [CC BY 4.0] via Sketchfab')
          p.write_bytes(s.encode('utf-8'))
          PY

      - name: Validate plaggy model and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          base = Path('assets/models/poi/bench')
          obj = json.loads((base / 'scene.gltf').read_text(encoding='utf-8'))
          assert obj['asset']['version'] == '2.0'
          assert obj['asset']['extras']['author'].startswith('plaggy')
          assert '096d4f915819409f9739326118bd5aa7' in obj['asset']['extras']['source']
          assert obj['buffers'][0]['uri'] == 'scene.bin'
          assert (base / 'scene.bin').stat().st_size == obj['buffers'][0]['byteLength'] == 34864
          for image in obj.get('images', []):
              uri = image['uri']
              f = base / uri
              assert f.exists(), f'missing texture: {uri}'
              assert f.stat().st_size < 2_000_000, f'texture still too large: {uri} {f.stat().st_size}'
          indices = obj['meshes'][0]['primitives'][0]['indices']
          triangles = obj['accessors'][indices]['count'] // 3
          assert triangles == 260, triangles
          print('Bench by plaggy triangles:', triangles)
          print('texture bytes:', sum((base / x['uri']).stat().st_size for x in obj['images']))
          PY
          node --check lib/playground3d.js
          grep -q './assets/models/poi/bench/scene.gltf' lib/playground3d.js
          test ! -e assets/models/poi/bench/bench.glb

      - name: Commit PR update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/models/poi/bench assets/models/poi/README.md lib/playground3d.js data/glot-custom.jsonc
          git rm .github/workflows/replace-bench-plaggy.yml
          git commit -m 'feat: replace bench model with Bench by plaggy'
          git push origin HEAD:feature/playground-3d-models
