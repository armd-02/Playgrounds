name: Apply swing and playground symbol update

on:
  push:
    branches:
      - feature/playground-3d-models
    paths:
      - .github/workflows/apply-swing-bars-springy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playground-3d-models
      - name: Apply updates
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/update_swing_bars_springy.py
          node --check lib/playground3d.js
          test -f assets/models/playground/poly-pizza/swing-set/swing.glb
          grep -q 'horizontal_bar: "horizontal_bar"' lib/playground3d.js
          grep -q 'springy: "springy"' lib/playground3d.js
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib/playground3d.js assets/models/playground data/glot-custom.jsonc
          git rm .github/scripts/update_swing_bars_springy.py
          git rm .github/workflows/apply-swing-bars-springy.yml
          git commit -m 'feat: update swing and add horizontal bar and springy 3D symbols'
          git push origin HEAD:feature/playground-3d-models
