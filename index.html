<!DOCTYPE html>
<html>

<head>
    <title>遊具のある公園マップ | すべり台・ブランコなど公園遊具を地図で探せます</title>
    <meta name="google-site-verification" content="TwbTRVYGqZKuaBwbe1gbdD9HEf1tc9eueQG6uTVb60Q" />
    <meta charset="utf-8" />
    <meta name="description"
        content="全国の公園にある遊具情報をOpenStreetMapをもとに表示するWeb地図です。すべり台・ブランコ・砂場など、子どもと遊べる公園探しや地域の公園調査に使えます。" />

    <meta property="og:description"
        content="全国の公園にある遊具情報をOpenStreetMapをもとに表示するWeb地図です。すべり台・ブランコ・砂場など、子どもと遊べる公園探しや地域の公園調査に使えます。" />
    <meta property="og:url" content="https://armd-02.github.io/Playgrounds/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="遊具のある公園マップ | すべり台・ブランコなど公園遊具を地図で探せます" />
    <meta property="og:image" content="https://armd-02.github.io/Playgrounds/image/ogimage.png" />
    <meta property="og:image:width" content="1640" />
    <meta property="og:image:height" content="924" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="遊具のある公園マップ | すべり台・ブランコなど公園遊具を地図で探せます" />
    <meta name="twitter:description"
        content="全国の公園にある遊具情報をOpenStreetMapをもとに表示するWeb地図です。すべり台・ブランコ・砂場など、子どもと遊べる公園探しや地域の公園調査に使えます。" />
    <meta name="twitter:image" content="https://armd-02.github.io/Playgrounds/image/ogimage.png" />

    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="preload" as="image" href="./image/Playgrounds.png?ver=20260902-05" />
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.jp" crossorigin />
    <link rel="stylesheet" href="system.css?ver=20260902-05" />
    <script type="module" src="./loader.module.js?ver=20260912-04"></script>
</head>

<body>
    <div id="startupStatus" role="status" aria-live="polite">
        <div class="startup-status-card">
            <img class="startup-splash-image" src="./image/Playgrounds.png?ver=20260902-05"
                alt="遊具のある公園マップ" />
            <div class="startup-status-spinner" aria-hidden="true"></div>
            <strong id="startupStatusMessage">アプリを読み込んでいます…</strong>
            <button id="startupRetry" type="button" onclick="location.reload()">再読み込み</button>
        </div>
    </div>
    <div class="container-fluid m-0 p-0">
        <article id="article" class="two-pane d-none" style="display: none">
            <main id="top-pane">
                <div id="mapid">
                    <canvas id="snow"></canvas>
                    <section id="cMapIntro" class="cMap-intro" aria-labelledby="cMapIntroTitle" hidden>
                        <div class="cMap-intro__body">
                            <h2 id="cMapIntroTitle">遊具のある公園を探してみましょう</h2>
                            <p>地図や「公園を探す」から、目的に合った公園と遊具を見つけられます。口コミは公園の詳細から投稿できます。</p>
                        </div>
                        <button id="cMapIntroClose" class="cMap-intro__close" type="button"
                            aria-label="案内を閉じる">&times;</button>
                    </section>
                </div>
            </main>
            <aside id="bottom-pane" class="row m-0">
                <div id="sidebarResizeHandle" title="ドラッグしてサイズ変更" aria-label="ドラッグしてリストのサイズを変更"></div>
                <div id="btmHeader" class="accordion p-2 h-100">

                    <!-- Detail -->
                    <div id="detailMenu" class="accordion-item mb-2">

                        <h2 id="detailHeader" class="d-flex align-items-center m-0 p-2">
                            <div class="dropdown me-2">
                                <button class="btn btn-light border-secondary p-0" type="button" id="btnMenuButton"
                                    data-bs-toggle="dropdown" aria-expanded="false" style="width: 30px; height: 30px">
                                    <i class="fas fa-bars text-black"></i>
                                </button>

                                <div class="dropdown-menu" aria-labelledby="btnMenuButton" id="btnMenu"></div>
                            </div>

                            <span class="detailTitle d-flex align-items-center" id="btmWindow_title"></span>
                            <button id="detailHeaderClose" type="button"
                                class="btn btn-light border-secondary p-0 ms-auto flex-shrink-0"
                                onclick="cMapMaker.changeMode('list')" aria-label="詳細を閉じる" title="詳細を閉じる">
                                <span aria-hidden="true" class="fs-1">&times;</span>
                            </button>
                        </h2>

                        <div id="detailArea">
                            <div class="accordion-body p-0">
                                <div id="mini-map" class="d-none mx-auto"></div>
                                <div id="btmWindow_message" class="p-1"></div>
                            </div>
                        </div>

                    </div>

                    <!-- list -->
                    <div class="accordion-item">
                        <h2 class="d-flex align-items-center m-0 p-2" id="listHeader">
                            <span class="detailTitle ms-1" id="listTitle"></span>
                            <span class="sidebar-window-controls btn-group ms-auto" role="group" aria-label="リスト表示サイズ">
                                <button id="sidebarMinimize" class="btn btn-light border-secondary p-0"
                                    type="button" onclick="winCont.setSidebar('mini')"
                                    aria-label="リストを最小化" title="最小化">
                                    <i class="fa-solid fa-window-minimize" aria-hidden="true"></i>
                                </button>
                                <button id="sidebarChange" class="btn btn-light border-secondary p-0"
                                    type="button" onclick="winCont.setSidebar('change')"
                                    aria-label="リストを最大化" title="最大化">
                                    <i class="fa-regular fa-window-maximize" aria-hidden="true"></i>
                                </button>
                            </span>
                        </h2>

                        <div id="listAccordion" class="accordion-collapse collapse show" aria-labelledby="listHeader">
                            <div class="accordion-body p-0">
                                <div class="d-flex align-items-center gap-2 p-2 border-bottom">
                                    <label for="listRatingFilter" class="text-nowrap mb-0" glot-model="listActionRating">評価で絞る</label>
                                    <select id="listRatingFilter" class="form-select form-select-sm"
                                        onchange="areaSearchController.applyRating(this.value)">
                                        <option value="0">指定なし</option>
                                        <option value="3">★3以上</option>
                                        <option value="4">★4以上</option>
                                        <option value="5">★5</option>
                                    </select>
                                </div>
                                <!-- リスト -->
                                <div class="col-12 p-0" id="listArea"></div>

                                <!-- プレイバック操作 -->
                                <div class="col-12 d-flex align-items-center" id="list_playback_control">
                                    <button class="btn btn-light float-left border-secondary ms-2 me-2"
                                        onclick="cMapMaker.playback(listTable.getFilterList());"><i id="list_playback"
                                            class="fas fa-play"></i></button>
                                    <input type="range" class="form-range me-2" id="list_speed" />
                                </div>

                                <!-- ダウンロード -->
                                <div class="col-12 text-center" id="list_download">
                                    <button class="btn btn-light btn-lg border-secondary w-50 m-2 p-1"
                                        onclick="cMapMaker.download()">
                                        <i class="fas fa-download"></i>
                                        <span glot-model="download"></span>
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div id="panelProgress" class="col-12 p-0 mb-2 progress progress-bar bg-success" style="width: 0%;">
                    </div>
                    <div class="footerSpace"></div>
                </div>

            </aside>
        </article>
    </div>

    <div id="splashImage" class="modal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document" data-keyboard="false">
            <div class="modal-body">
                <img src="" style="width: 100%;float: none !important" id="splashSrc"><br>
                <div class="d-flex justify-content-center mt-2">
                    <div class="spinner-border text-primary mx-auto" role="status"> </div>
                </div>
            </div>
        </div>
    </div>

    <aside id="areaFeatureSummary" class="area-feature-summary" aria-live="polite" hidden>
        <div id="areaFeatureChips" class="area-feature-chips"></div>
        <strong id="areaFeatureResultCount"></strong>
        <button class="btn btn-sm btn-light border-secondary" type="button" onclick="areaSearchController.reapplyCurrentView()">この範囲で再検索</button>
        <button class="btn btn-sm btn-outline-danger" type="button" onclick="areaSearchController.clear()" aria-label="検索条件を解除">解除</button>
    </aside>

    <div id="areaFeaturePanel" class="modal area-feature-panel" tabindex="-1"
        aria-labelledby="areaFeatureHeading" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable area-feature-dialog">
        <div class="modal-content area-feature-sheet">
            <header class="area-feature-header">
                <div>
                    <strong id="areaFeatureHeading">公園を探す</strong>
                    <small id="areaFeatureDescription">いま地図に表示している範囲が対象です</small>
                </div>
                <button class="btn btn-light border-secondary" type="button" data-bs-dismiss="modal" aria-label="閉じる"><i class="fas fa-xmark"></i></button>
            </header>

            <section id="areaFeatureSearchContent">
                <div id="areaFeatureZoomNotice" class="alert alert-info" hidden>
                    この縮尺では公園データをまだ読み込んでいません。
                    <button class="btn btn-sm btn-primary ms-1" type="button" onclick="areaSearchController.zoomForSearch()">拡大して読み込む</button>
                </div>
                <h2>目的から探す</h2>
                <div class="area-preset-grid">
                    <button type="button" onclick="areaSearchController.applyPreset('small')">🧒 小さい子と遊ぶ</button>
                    <button type="button" onclick="areaSearchController.applyPreset('play')">🛝 たくさん遊ぶ</button>
                    <button type="button" onclick="areaSearchController.applyPreset('relax')">🌿 ゆっくり過ごす</button>
                    <button type="button" onclick="areaSearchController.applyPreset('hot')">🌳 暑い日に休む</button>
                    <button type="button" onclick="areaSearchController.applyPreset('access')">🚌 行きやすさ重視</button>
                    <button type="button" onclick="areaSearchController.applyPreset('rated')">⭐ 高評価の公園</button>
                </div>
                <form id="areaFeatureForm">
                    <div class="area-feature-field">
                        <label for="areaFeatureScore">評価</label>
                        <select id="areaFeatureScore" name="scoreMin" class="form-select">
                            <option value="0">指定なし</option>
                            <option value="3">★3以上</option>
                            <option value="4">★4以上</option>
                            <option value="5">★5</option>
                        </select>
                    </div>
                    <fieldset class="area-feature-field">
                        <legend>よかった点</legend>
                        <div id="areaFeatureAttributes" class="area-feature-check-grid"></div>
                        <div class="area-match-mode">
                            <label><input type="radio" name="matchMode" value="and" checked> すべて満たす</label>
                            <label><input type="radio" name="matchMode" value="or"> いずれかを満たす</label>
                        </div>
                    </fieldset>
                    <fieldset class="area-feature-field">
                        <legend>情報の状態</legend>
                        <div class="area-feature-check-grid">
                            <label class="area-feature-check"><input type="checkbox" name="recentOnly">1年以内に確認</label>
                            <label class="area-feature-check"><input type="checkbox" name="photoOnly">写真あり</label>
                            <label class="area-feature-check"><input type="checkbox" name="detailOnly">詳細情報あり</label>
                        </div>
                    </fieldset>
                    <div class="area-feature-actions">
                        <button class="btn btn-light border-secondary" type="reset" onclick="setTimeout(() => areaSearchController.updatePreviewCount())">条件をリセット</button>
                        <button class="btn btn-success" type="button" onclick="areaSearchController.applyFromForm()"><span id="areaFeaturePreviewCount">0件</span>を表示</button>
                    </div>
                </form>
            </section>

            <section id="areaFeatureRatingContent" hidden>
                <h2>星の数で表示を絞り込む</h2>
                <p>同じ公園に複数の評価がある場合は、その平均値を使います。</p>
                <div class="area-rating-grid">
                    <button type="button" onclick="areaSearchController.applyRating(3)"><strong>★3以上</strong><small>平均3.0以上</small></button>
                    <button type="button" onclick="areaSearchController.applyRating(4)"><strong>★4以上</strong><small>平均4.0以上</small></button>
                    <button type="button" onclick="areaSearchController.applyRating(5)"><strong>★5</strong><small>平均5.0</small></button>
                    <button type="button" onclick="areaSearchController.applyRating(0)"><strong>指定なし</strong><small>評価の絞り込みを解除</small></button>
                </div>
            </section>

            <section id="areaFeatureReportContent" hidden>
                <h2>この範囲の公園レポート</h2>
                <div id="areaFeatureReportMetrics" class="area-report-metrics"></div>
                <div class="area-report-columns">
                    <div><h3>評価</h3><ul id="areaFeatureReportScores"></ul></div>
                    <div><h3>よかった点</h3><ul id="areaFeatureReportAttributes"></ul></div>
                </div>
            </section>

            <section id="areaFeatureResearchContent" hidden>
                <h2>口コミ・情報を募集中の公園を探す</h2>
                <p>感想や評価、写真などを追加できそうな公園だけを地図と一覧に表示します。</p>
                <div class="area-research-grid">
                    <button type="button" onclick="areaSearchController.applyResearch('missing')"><i class="far fa-file-lines"></i><strong>詳細情報がない</strong><small>評価・特徴・メモなどが未登録</small></button>
                    <button type="button" onclick="areaSearchController.applyResearch('stale')"><i class="far fa-clock"></i><strong>1年以上未確認</strong><small>現地の変化を確認したい公園</small></button>
                    <button type="button" onclick="areaSearchController.applyResearch('photo')"><i class="far fa-image"></i><strong>写真がない</strong><small>現在の様子が分かる写真を募集</small></button>
                    <button type="button" onclick="areaSearchController.applyResearch('sparse')"><i class="fas fa-list-check"></i><strong>情報が少ない</strong><small>登録項目が2つ未満の公園</small></button>
                </div>
            </section>
        </div>
        </div>
    </div>

    <div id="PinchImageBK" onclick="modalActs.closeMedia()">
        <div class="d-flex align-items-center justify-content-center h-100">
            <div class="spinner-border text-primary" id="image_spinner"></div>
        </div>
    </div>
    <img id="PinchImage" draggable="false" onclick="modalActs.toggleImageSize(this, event)"></img>
    <button type="button" id="PinchImageClose" aria-label="画像を閉じる" title="閉じる"
        onclick="event.stopPropagation(); modalActs.closeMedia()">✕</button>
    <video id="FullScreenVideo" playsinline onclick="modalActs.toggleVideo(this)"></video>
    <button type="button" id="FullScreenVideoClose" aria-label="動画を閉じる" title="閉じる"
        onclick="event.stopPropagation(); modalActs.closeMedia()">✕</button>

    <div id="scrollHand" class="d-flex justify-content-center d-none">
        <img src="./image/hand-pointer-solid.svg" width="42px">
    </div>
</body>

</html>
